name: Windows dasturi (Setup.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Repoga zipning o'zi yuklansa (Add file → Upload files → oqtosh-desktop.zip):
      # ichidagisi ochiladi, repodagi fayllar yangilanadi, zip o'chiriladi va yangisi yig'iladi.
      - name: Zipni ochish (yuklangan bo'lsa)
        id: unzip
        shell: bash
        run: |
          set -euo pipefail
          zip=""; best=-1
          for f in *.zip; do
            [ -f "$f" ] || continue
            t="$(git log -1 --format=%ct -- "$f" 2>/dev/null || true)"; t="${t:-0}"
            if [ "$t" -gt "$best" ]; then zip="$f"; best="$t"; fi
          done
          if [ -z "$zip" ]; then echo "Zip yo'q — repodagi fayllardan yig'iladi."; exit 0; fi
          echo "Zip topildi: $zip"
          PY="$(command -v python || command -v python3)"
          rm -rf .zip-src && mkdir .zip-src
          "$PY" -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$zip" .zip-src
          # dasturning o'z package.json'i (ichidagi server/package.json emas)
          pkg="$(grep -l '"name": "oqtosh-kassa"' $(find .zip-src -maxdepth 3 -name package.json -not -path '*/node_modules/*') 2>/dev/null | head -1 || true)"
          [ -n "$pkg" ] || { echo "Zip ichida package.json topilmadi — bu oqtosh-desktop.zip emas."; exit 1; }
          cp -R "$(dirname "$pkg")"/. .
          rm -rf .zip-src node_modules dist
          git rm -q --cached --ignore-unmatch -- *.zip
          rm -f -- *.zip
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Ochilgan fayllarni repoga yozish
        if: steps.unzip.outputs.zip != ''
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github'
          if git diff --cached --quiet; then echo "O'zgarish yo'q."; exit 0; fi
          git commit -q -m "Zipdan yangilandi: ${{ steps.unzip.outputs.zip }}"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketlarni o'rnatish
        run: npm install --no-audit --no-fund

      # Server kompyuteri: sayt kodi (server/) uchun paketlar va Cloudflare Tunnel dasturi
      - name: Server paketlari
        shell: bash
        run: cd server && npm install --omit=dev --no-audit --no-fund

      - name: cloudflared (Cloudflare Tunnel)
        shell: bash
        run: |
          mkdir -p bin
          curl -fsSL --retry 3 -o bin/cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
          ./bin/cloudflared.exe --version

      - name: Printer moduli tekshiruvi
        run: npm test

      - name: Kameralar moduli tekshiruvi (soxta videoregistrator bilan)
        run: node test/cameras-smoke.js

      - name: Server tekshiruvi (Windows'da ishga tushib, ma'lumotni saqlashi)
        run: node test/server-smoke.js

      # har yig'ishda versiya o'sadi (2.1.<raqam>) — o'rnatilgan dasturlar yangisini o'zi topadi
      - name: Versiya
        run: npm version 2.1.${{ github.run_number }} --no-git-tag-version --allow-same-version

      # bash: PowerShell "-c.publish.repo=..." ni ikkiga bo'lib yuboradi (electron-builder uni fayl deb o'qiydi)
      - name: Setup.exe yig'ish
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Fayl (Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Oqtosh-Kassa-Setup
          path: dist/Oqtosh-Kassa-Setup.exe

      - name: Reliz (doimiy yuklab olish havolasi)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Oqtosh Kassa 2.1.${{ github.run_number }}
          body: |
            Yuklab oling va o'rnating: Oqtosh-Kassa-Setup.exe
            "Windows protected your PC" chiqsa: More info → Run anyway.
          # latest.yml va .blockmap — dastur ichidagi yangilagich (electron-updater) shularni o'qiydi
          files: |
            dist/Oqtosh-Kassa-Setup.exe
            dist/Oqtosh-Kassa-Setup.exe.blockmap
            dist/latest.yml
          make_latest: true
