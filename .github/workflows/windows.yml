name: Windows dasturi (Setup.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketlarni o'rnatish
        run: npm install --no-audit --no-fund

      - name: Printer moduli tekshiruvi
        run: npm test

      - name: Setup.exe yig'ish
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Fayl (Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Oqtosh-Kassa-Setup
          path: dist/Oqtosh-Kassa-Setup.exe

      - name: Reliz (doimiy yuklab olish havolasi)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Oqtosh Kassa (yig'ish ${{ github.run_number }})
          body: |
            Yuklab oling va o'rnating: Oqtosh-Kassa-Setup.exe
            "Windows protected your PC" chiqsa: More info → Run anyway.
          files: dist/Oqtosh-Kassa-Setup.exe
          make_latest: true
